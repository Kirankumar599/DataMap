# Demo / Offline Fallback Profile (run with: --spring.profiles.active=demo)
# Uses in-memory H2 in PostgreSQL compatibility mode when local Postgres is unavailable.
spring.datasource.url=jdbc:h2:mem:datamap_demo;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
